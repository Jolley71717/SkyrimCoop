# Uploads a release's Nexus zip (the one without the dedicated server) to the mod's main file on Nexus Mods, as its new
# version. Run by hand only (Actions > Upload to Nexus > Run workflow), for every release whose candidate passed its
# soak (docs/RELEASING.md). The GitHub release must already carry SkyrimCoop-X.Y.Z-nexus.zip.
#
# The mod's page is Nexus Mods page 200124. This action (Nexus-Mods/upload-action, API v3) only adds a new version to a
# file that already exists: it cannot create a page's first file. That first file was uploaded by hand on the page's
# Manage files screen on 2026-11-24 (a placeholder, version 0.0.1, while the page was unpublished); its id and the mod's
# API id below were read from that file's "Advanced" view. The repository secret NEXUSMODS_API_KEY is set. Every upload
# from now on goes through this workflow, never by hand. Carried from the sister project (F4Multiplayer).
name: Upload to Nexus

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (vX.Y.Z; release candidates never go to Nexus). May be empty with check_only, which then checks the API key alone
        required: false
        default: ""
      check_only:
        description: Only check the zip and the API key; upload nothing
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The main file's API file id and the mod's unique API id (for the changelog), both read from the main file's
  # "Advanced" view on the Manage files screen. The mod id is the API id, not the page number:
  # (game id << 32) | page number = (1704 << 32) | 200124.
  NEXUS_FILE_ID: "8450994"
  NEXUS_MOD_ID: "7318624472508"

jobs:
  upload:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Refuse until the Nexus ids are set
        env:
          TAG: ${{ inputs.tag }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ -z "$TAG" ] && [ "$CHECK_ONLY" != true ]; then
            echo "::error::Give the release tag to upload"
            exit 1
          fi
          if [ "$CHECK_ONLY" = true ] && [ -z "$TAG" ]; then
            echo "Key-only check: the ids are not needed"
            exit 0
          fi
          if [ -z "$NEXUS_FILE_ID" ] || [ -z "$NEXUS_MOD_ID" ]; then
            echo "::error::Not in use yet: upload the page's first file by hand on Nexus, then set NEXUS_FILE_ID in this file and the repository secret NEXUSMODS_API_KEY first (docs/RELEASING.md)."
            exit 1
          fi

      - name: Take the release's Nexus zip
        id: zip
        if: ${{ inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag (vX.Y.Z)"
            exit 1
          fi
          version="${TAG#v}"
          zip="SkyrimCoop-$version-nexus.zip"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$zip"
          # The dedicated server stays on GitHub: on the sister project an upload holding its server was held for a
          # manual virus review every time.
          if unzip -Z1 "$zip" | grep -qi 'SkyrimCoopServer\.exe'; then
            echo "::error::$zip holds SkyrimCoopServer.exe"
            exit 1
          fi
          unzip -Z1 "$zip" | grep -qx 'SKSE/Plugins/SkyrimCoop.dll' || { echo "::error::$zip has no SKSE/Plugins/SkyrimCoop.dll"; exit 1; }
          # The changelog, one line per entry, is dist/NEXUS-X.Y.Z.txt on main, or at the tag when main doesn't have it.
          # Main first: a promoted rc's tag is the rc's commit, and a changelog corrected after the rc is only on main.
          if content=$(gh api "repos/$GITHUB_REPOSITORY/contents/dist/NEXUS-$version.txt?ref=main" --jq .content 2>/dev/null) ||
             content=$(gh api "repos/$GITHUB_REPOSITORY/contents/dist/NEXUS-$version.txt?ref=$TAG" --jq .content 2>/dev/null); then
            printf '%s' "$content" | base64 -d | tr -d '\r' > changelog.txt
          else
            : > changelog.txt
          fi
          {
            echo "version=$version"
            echo "zip=$zip"
            echo "changelog<<CHANGELOG_END"
            sed -e '$a\' changelog.txt
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: Check the API key
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "::error::The repository secret NEXUSMODS_API_KEY is not set"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $NEXUSMODS_API_KEY" https://api.nexusmods.com/v1/users/validate.json)
          if [ "$status" != 200 ]; then
            echo "::error::Nexus refused the API key (HTTP $status)"
            exit 1
          fi
          echo "Nexus accepts the API key"

      - name: Upload to Nexus Mods
        if: ${{ !inputs.check_only }}
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2  # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          filename: ${{ steps.zip.outputs.zip }}
          version: ${{ steps.zip.outputs.version }}
          display_name: SkyrimCoop ${{ steps.zip.outputs.version }}
          description: >-
            The mod: SKSE plugin, settings file and install guide. Everyone in a session needs the same version. Dedicated server: GitHub.
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          update_mod_version: true
          changelog: ${{ steps.zip.outputs.changelog }}
