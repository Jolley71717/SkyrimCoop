name: Bug report
description: Something crashes, desyncs or does not work
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. One bug per issue, please.

        **Before you attach anything:** the plugin log is written to name other players only as
        `player N`, Steam accounts as short aliases like `~3fa2c1`, and to mask IP addresses.
        Crash logs from other tools, screenshots and anything else you attach can still contain
        Steam names, Steam ids (17-digit numbers), your Windows user name in file paths, and the
        names of your friends. Remove whatever you do not want public. Issues on GitHub are
        visible to everyone and stay in the history even after editing.

        Need the log? It is at `Documents\My Games\Skyrim Special Edition\SKSE\SkyrimCoop.log`.
        Its first lines name the build and the game version. The plugin keeps the logs of the
        last three launches next to it: if you restarted the game after the problem,
        `SkyrimCoop.1.log` is the one that saw it.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The first line of `Documents\My Games\Skyrim Special Edition\SKSE\SkyrimCoop.log`.
      placeholder: "SkyrimCoop 0.0.1"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: The game version the log names (or the one the game's main menu shows), and the SKSE version.
      placeholder: "Skyrim Special Edition 1.7.104, SKSE 2.3.1"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Were you the host or a joiner?
      options:
        - Host
        - Joiner
        - Both (it happened on both sides)
        - Dedicated server (SkyrimCoopServer.exe)
        - Not in a session (the problem is at start-up)
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: How were you connected?
      description: Steam is the default. Direct UDP is `sTransport = enet` with `sServerAddress` set.
      options:
        - Steam (invite or Join Game from the overlay)
        - Direct UDP / ENet (sTransport = enet)
        - Dedicated server (SkyrimCoopServer.exe)
        - Not connected
        - Not sure
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      description: Every plugin in your load order, or write "vanilla + the Anniversary content". Everyone in a session needs the same list, so say if it differed.
      placeholder: vanilla
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What everyone did, in order, up to the moment it went wrong. Say which player did what.
      placeholder: |
        1. Host loads a save in Riverwood, joiner accepts the invite
        2. Both walk to Whiterun
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: plugin_log
    attributes:
      label: Plugin log
      description: Drag `Documents\My Games\Skyrim Special Edition\SKSE\SkyrimCoop.log` from the game where it went wrong into this box (from both games if you can; `SkyrimCoop.1.log` if the game was restarted since). Attach the file itself; links to download, file-sharing or paste sites won't be opened.
    validations:
      required: true
  - type: textarea
    id: crash_log
    attributes:
      label: Crash log
      description: If the game crashed and you have a crash logger installed, drag in its crash log too. Attach the file itself, not a link, and check it for your Windows user name first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal data
      options:
        - label: I checked everything I attached above (logs, crash logs, screenshots) and removed Steam names, Steam ids and Windows user names that I do not want public.
          required: true
        - label: Everyone in the session ran the same version of the mod.
          required: false
