# SkyrimCoop settings
#
# The file is read when the game starts: change it, then restart the game.
# The mod is pre-alpha (dist/INSTALL.md and the release notes say what works). To play together: the host sets
# bHost = true and starts a game from a save, friends leave it false and join through the Steam overlay.

# Your name as other players see it. "character" = the name of the character you play. Empty = your Steam name.
# Or write any name.
sPlayerName = character

# --- Hosting ---------------------------------------------------------------
# One player hosts (bHost = true); the host's save is the world everyone plays in.
# Friends join through Steam: nobody opens ports.
bHost = false

# How friends connect:
#   auto   Steam when it's available, otherwise direct UDP (default)
#   steam  Steam only
#   enet   direct UDP to the host's address and iPort (LAN, VPN or a
#          forwarded port; the host must allow UDP iPort through the firewall)
sTransport = auto

# Only for joining over direct UDP: the host's address ("address" or "address:port").
# Leave empty to join through Steam.
sServerAddress =
iPort = 7780
# Host only: how many players can be in the session at once, the host included (2 to 8).
iMaxPlayers = 4
# Optional; everyone must use the same password.
sPassword =

# true = while you are in a session, the game keeps running when you alt-tab, so friends still see you (you can be
# hurt meanwhile). Playing alone, alt-tab pauses the game as before, and the game's own setting is left as you had it.
bRunInBackground = true

# The language of the mod's messages. Empty = the game's language. Or one of
# en, en-gb, de, es, es-mx, fr, it, ja, pl, pt-br, ru, uk, zh-cn, zh-tw (the files in SKSE\Plugins\SkyrimCoop\lang).
sLanguage =

# --- Troubleshooting -------------------------------------------------------
# false = the mod leaves the game's Steam library alone (no lobbies, invites or relay; only direct UDP is left).
# For finding out whether a start-up problem has to do with Steam.
bSteam = true
# info (default) or debug (more lines, for a bug report the maintainer asked for).
sLogLevel = info

# --- For the mod's own test machines only ------------------------------------
# true = test scripts on this PC can drive the game through a local channel (127.0.0.1 only, with a token kept in
# Documents\My Games\Skyrim Special Edition\SKSE). Leave it false.
bDevChannel = false
iDevChannelPort = 7791
